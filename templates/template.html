<!doctype html>
<html>

<head>
  <title>$title$</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/reveal.js@4.2.0/dist/reveal.css">
  <link rel="stylesheet" href="https://unpkg.com/reveal.js@4.2.0/dist/theme/black.css" id="theme">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/default.min.css">
  <script src="https://kirubeltadesse.github.io/presentation/resources/highlight/highlight.min.js"></script>
  
  <!-- Footer styles -->
  <style>
    #footer {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7em;
      color: rgba(255, 255, 255, 0.6);
      z-index: 1;
      pointer-events: none;
    }
    .reveal.has-dark-background #footer {
      color: rgba(255, 255, 255, 0.6);
    }
    .reveal.has-light-background #footer {
      color: rgba(0, 0, 0, 0.6);
    }
  </style>

</head>

<body>
  <div class="reveal">
    <div class="slides">
      $body$
    </div>
  </div>


  <script src="https://unpkg.com/reveal.js@4.2.0/dist/reveal.js"></script>

  <!-- reveal.js plugins -->
  <script src="https://unpkg.com/reveal.js@4.2.0/plugin/notes/notes.js"></script>
  <script src="https://unpkg.com/reveal.js@4.2.0/plugin/search/search.js"></script>
  <script src="https://unpkg.com/reveal.js@4.2.0/plugin/zoom/zoom.js"></script>

  <!-- adding dazzleSketch js -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
  <script src="https://kirubeltadesse.github.io/presentation/resources/js/sketch.js"></script>
  <script src="https://kirubeltadesse.github.io/presentation/resources/js/dazzleSketch.js"></script>

  <script>
    Reveal.initialize({
      // Display controls in the bottom right corner
      controls: true,

      // Help the user learn the controls by providing hints, for example by
      // bouncing the down arrow when they first encounter a vertical slide
      controlsTutorial: true,

      // Determines where controls appear, "edges" or "bottom-right"
      controlsLayout: 'bottom-right',

      // Visibility rule for backwards navigation arrows; "faded", "hidden"
      // or "visible"
      controlsBackArrows: 'faded',

      // Display a presentation progress bar
      progress: true,

      // Display the page number of the current slide
      slideNumber: true,

      // 'all', 'print', or 'speaker'
      showSlideNumber: 'all',

      // Add the current slide number to the URL hash so that reloading the
      // page/copying the URL will return you to the same slide
      hash: true,

      // Start with 1 for the hash rather than 0
      hashOneBasedIndex: false,

      // Flags if we should monitor the hash and change slides accordingly
      respondToHashChanges: true,

      // Push each slide change to the browser history
      history: false,

      // Enable keyboard shortcuts for navigation
      keyboard: true,

      // Enable the slide overview mode
      overview: true,

      // Disables the default reveal.js slide layout (scaling and centering)
      // so that you can use custom CSS layout
      disableLayout: false,

      // Vertical centering of slides
      center: true,

      // Enables touch navigation on devices with touch input
      touch: true,

      // Loop the presentation
      loop: false,

      // Change the presentation direction to be RTL
      rtl: false,

      // see https://revealjs.com/vertical-slides/#navigation-mode
      navigationMode: 'default',

      // Randomizes the order of slides each time the presentation loads
      shuffle: false,

      // Turns fragments on and off globally
      fragments: true,

      // Flags whether to include the current fragment in the URL,
      // so that reloading brings you to the same fragment position
      fragmentInURL: true,

      // Flags if the presentation is running in an embedded mode,
      // i.e. contained within a limited portion of the screen
      embedded: false,

      // Flags if we should show a help overlay when the questionmark
      // key is pressed
      help: true,

      // Flags if it should be possible to pause the presentation (blackout)
      pause: true,

      // Flags if speaker notes should be visible to all viewers
      showNotes: false,

      // Global override for autoplaying embedded media (null/true/false)
      autoPlayMedia: null,

      // Global override for preloading lazy-loaded iframes (null/true/false)
      preloadIframes: null,

      // Number of milliseconds between automatically proceeding to the
      // next slide, disabled when set to 0, this value can be overwritten
      // by using a data-autoslide attribute on your slides
      autoSlide: 0,

      // Stop auto-sliding after user input
      autoSlideStoppable: true,

      // Use this method for navigation when auto-sliding
      autoSlideMethod: null,

      // Specify the average time in seconds that you think you will spend
      // presenting each slide. This is used to show a pacing timer in the
      // speaker view
      defaultTiming: null,

      // Enable slide navigation via mouse wheel
      mouseWheel: false,

      // The display mode that will be used to show slides
      display: 'block',

      // Hide cursor if inactive
      hideInactiveCursor: true,

      // Time before the cursor is hidden (in ms)
      hideCursorTime: 5000,

      // Opens links in an iframe preview overlay
      previewLinks: false,

      // Specify the horizontal and vertical margins of the content within
      // the slide
      margin: 0.1,

      // Transition style (none/fade/slide/convex/concave/zoom)
      transition: 'slide',

      // Transition speed (default/fast/slow)
      transitionSpeed: 'default',

      // Transition style for full page slide backgrounds
      // (none/fade/slide/convex/concave/zoom)
      backgroundTransition: 'fade',

      // Number of slides away from the current that are visible
      viewDistance: 3,

      // Number of slides away from the current that are visible on mobile
      // devices. It is advisable to set this to a lower number than
      // viewDistance in order to save resources.
      mobileViewDistance: 2,

      // reveal.js plugins
      plugins: [
        RevealNotes,
        RevealSearch,
        RevealZoom
      ],
    });
    hljs.highlightAll();

    // Footer functionality
    var footerConfig = {
      enabled: $if(footer-enabled)$$footer-enabled$$else$false$endif$,
      title: "$if(footer-title)$$footer-title$$else$$title$$endif$"
    };

    if (footerConfig.enabled) {
      var footer = document.createElement('div');
      footer.id = 'footer';
      footer.innerHTML = footerConfig.title;
      document.querySelector('.reveal').appendChild(footer);

      // Update footer visibility based on slide background
      Reveal.on('slidechanged', function(event) {
        var currentSlide = event.currentSlide;
        var background = window.getComputedStyle(currentSlide).backgroundColor;
        
        // Simple heuristic to detect dark vs light background
        var rgb = background.match(/\d+/g);
        if (rgb) {
          var brightness = (parseInt(rgb[0]) * 299 + parseInt(rgb[1]) * 587 + parseInt(rgb[2]) * 114) / 1000;
          if (brightness > 128) {
            document.querySelector('.reveal').classList.add('has-light-background');
            document.querySelector('.reveal').classList.remove('has-dark-background');
          } else {
            document.querySelector('.reveal').classList.add('has-dark-background');
            document.querySelector('.reveal').classList.remove('has-light-background');
          }
        }
      });
    }
  </script>
</body>
</html>
